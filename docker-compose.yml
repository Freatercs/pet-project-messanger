services:
  postgres:
    image: postgres:17-alpine
    container_name: messanger-postgres
    environment:
      POSTGRES_DB: messanger
      POSTGRES_USER: messanger
      POSTGRES_PASSWORD: messanger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: